<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="Doxa Icon">
    <!-- Defaults shown when Safari's extension-state API is unavailable (it
         returns SFErrorDomain Code=1 on macOS 15+ until the extension has been
         enabled at least once), so they must name the current UI path. -->
    <p class="state-unknown">Turn on Doxa’s extension in Safari: choose Settings, then Extensions.</p>
    <p class="state-on">Doxa’s extension is currently on. You can turn it off in Safari Settings, Extensions.</p>
    <p class="state-off">Doxa’s extension is currently off. You can turn it on in Safari Settings, Extensions.</p>
    <button class="open-preferences">Quit and Open Safari Settings…</button>
</body>
</html>
