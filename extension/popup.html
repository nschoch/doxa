<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doxa</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Doxa</h1>
      <p class="subtitle">AI comment &amp; video summarizer</p>
    </header>

    <main>
      <div id="updateBanner" class="update hidden">
        <div class="update-text">
          <strong>Update available</strong>
          <span id="updateDetail"></span>
        </div>
        <div class="update-actions">
          <button id="viewReleaseBtn" class="update-cta">View release</button>
          <button id="dismissUpdateBtn" class="update-dismiss" title="Dismiss for this version">×</button>
        </div>
      </div>

      <button id="summarizeBtn" class="primary">Summarize comments</button>
      <button id="geminiBtn" class="ghost wide hidden">Summarize YouTube video with Gemini (open in new tab)</button>
      <p class="hint">The result appears as a card on the page, so you can keep browsing.</p>

      <div id="status" class="status hidden"></div>
    </main>

    <details id="settings" class="settings">
      <summary>Settings</summary>

      <label>
        Provider
        <select id="provider">
          <option value="ollama">Ollama (local)</option>
          <option value="openrouter">OpenRouter (online)</option>
          <option value="ninfer">Ninfer (local, OpenAI-compatible)</option>
        </select>
      </label>

      <div id="ollamaGroup">
        <label>
          Ollama URL
          <input id="ollamaUrl" type="text" placeholder="http://10.20.10.99:11434" />
        </label>
        <label>
          Ollama model
          <input id="model" type="text" placeholder="qwen3.6:35b-a3b" />
        </label>
      </div>

      <div id="onlineGroup" class="hidden">
        <label>
          OpenRouter model
          <input id="openrouterModel" type="text" placeholder="openai/gpt-4o-mini" />
        </label>
      </div>

      <div id="ninferGroup" class="hidden">
        <label>
          Ninfer URL
          <input id="ninferUrl" type="text" placeholder="http://10.20.10.99:8000/v1" />
        </label>
        <label>
          Ninfer model
          <input id="ninferModel" type="text" placeholder="qwen3.6-27b-ninfer" />
        </label>
      </div>

      <label id="apiKeyGroup" class="hidden">
        LLM API key (for OpenRouter / Ninfer)
        <input id="apiKey" type="password" placeholder="sk-or-… / (blank for a local server)" />
      </label>

      <div class="model-actions">
        <button id="fetchModelsBtn" class="ghost">Fetch available models</button>
        <select id="modelsList" class="hidden"></select>
      </div>

      <div class="settings-group">
        <span class="group-label">Sites</span>
        <label class="check">
          <input id="siteReddit" type="checkbox" checked />
          Reddit
        </label>
        <label class="check">
          <input id="siteYoutube" type="checkbox" checked />
          YouTube (summarize needs API key)
        </label>
        <label>
          YouTube Data API key
          <input id="youtubeApiKey" type="password" placeholder="AIza…" />
        </label>
      </div>

      <label>
        Timeout (seconds)
        <input id="timeoutSec" type="number" min="10" max="900" />
      </label>

      <label>
        Max comments to send
        <input id="maxComments" type="number" min="1" max="2000" />
      </label>

      <label class="check">
        <input id="autoSave" type="checkbox" checked />
        Save settings automatically
      </label>
      <button id="saveBtn" class="ghost">Save settings</button>
    </details>

    <footer>
      <span id="versionLabel" class="version"></span>
      <a href="#" id="helpLink" title="Open the Doxa README for setup instructions">Setup help</a>
      <a href="#" id="checkUpdatesLink">Check for updates</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
